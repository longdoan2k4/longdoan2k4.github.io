{{/* Custom CSS cho posts layout */}}
{{ $customPostsCSS := resources.Get "css/custom-posts.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $customPostsCSS.RelPermalink }}" integrity="{{ $customPostsCSS.Data.Integrity }}">

<style>
/* Direct override để đảm bảo CSS được áp dụng */
.posts-list-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.post-list-item {
  background: rgba(255, 255, 255, 0.02);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 2rem;
  margin-bottom: 2rem;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  opacity: 0;
}

.post-list-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.post-list-item:hover {
  transform: translateY(-8px) scale(1.02);
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(255, 107, 107, 0.3);
  box-shadow: 
    0 20px 40px rgba(0, 0, 0, 0.3),
    0 0 0 1px rgba(255, 107, 107, 0.1);
}

.post-list-item:hover::before {
  transform: scaleX(1);
}

.post-meta-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
  font-size: 0.9rem;
  opacity: 0.8;
  transition: opacity 0.3s ease;
}

.post-list-item:hover .post-meta-header {
  opacity: 1;
}

.post-date {
  color: #888;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.post-category {
  background: rgba(255, 107, 107, 0.15);
  color: #ff6b6b;
  padding: 0.3rem 0.8rem;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.8rem;
  border: 1px solid rgba(255, 107, 107, 0.3);
  transition: all 0.3s ease;
}

.post-list-item:hover .post-category {
  background: rgba(255, 107, 107, 0.25);
  border-color: rgba(255, 107, 107, 0.5);
  transform: scale(1.05);
}

.post-title {
  margin: 1rem 0 1.5rem 0;
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1.3;
  transition: all 0.3s ease;
}

.post-title a {
  color: #fff;
  text-decoration: none;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.post-title a::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.post-title a:hover {
  color: #ff6b6b;
  transform: translateX(5px);
}

.post-title a:hover::after {
  width: 100%;
}

.post-summary {
  color: #bbb;
  font-size: 1rem;
  line-height: 1.7;
  margin-bottom: 1.5rem;
  transition: color 0.3s ease;
}

.post-list-item:hover .post-summary {
  color: #ccc;
}

.post-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  padding-top: 1rem;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.read-more {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: #ff6b6b;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  padding: 0.5rem 1rem;
  border: 1px solid rgba(255, 107, 107, 0.3);
  border-radius: 25px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.read-more::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 107, 107, 0.1), transparent);
  transition: left 0.5s ease;
}

.read-more:hover {
  color: #fff;
  background: rgba(255, 107, 107, 0.2);
  border-color: rgba(255, 107, 107, 0.5);
  transform: translateY(-2px);
}

.read-more:hover::before {
  left: 100%;
}

.post-time {
  font-size: 0.85rem;
  color: #888;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  transition: color 0.3s ease;
}

.post-list-item:hover .post-time {
  color: #aaa;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.post-list-item:nth-child(1) { animation-delay: 0.1s; }
.post-list-item:nth-child(2) { animation-delay: 0.2s; }
.post-list-item:nth-child(3) { animation-delay: 0.3s; }
.post-list-item:nth-child(4) { animation-delay: 0.4s; }
.post-list-item:nth-child(5) { animation-delay: 0.5s; }
.post-list-item:nth-child(n+6) { animation-delay: 0.6s; }

@media (max-width: 768px) {
  .posts-list-container {
    padding: 1rem 0.5rem;
  }
  
  .post-list-item {
    margin-bottom: 1.5rem;
    padding: 1.5rem;
  }
  
  .post-list-item:hover {
    transform: translateY(-4px) scale(1.01);
  }
  
  .post-title {
    font-size: 1.4rem;
  }
  
  .post-meta-header {
    flex-wrap: wrap;
  }
  
  .post-footer {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.75rem;
  }
  
  .read-more {
    align-self: stretch;
    justify-content: center;
  }
}
</style>
